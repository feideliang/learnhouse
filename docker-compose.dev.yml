services:
  app:
    command: >
      sh -c "
        cd /app/web && bun install --no-frozen-lockfile &&
        ( cd /app/web && bunx next dev --turbo --port 8000 --hostname 0.0.0.0 ) &
        ( cd /app/api && .venv/bin/uvicorn src.app:app --host 0.0.0.0 --port 9001 ) &
        nginx -g 'daemon off;'
      "
    ports:
      - "3088:8088"
    volumes:
      - /data/service/learnhouse/learnhouse/apps/api:/app/api
      - /data/service/learnhouse/docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - /app/api/.venv
      - ./learnhouse/apps/web:/app/web
    environment:
      - NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL=http://localhost:3088

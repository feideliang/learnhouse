name: learnhouse
services:
  app:
    image: learnhouse:latest
    container_name: learnhouse-app
    restart: unless-stopped
    ports:
      - 8088:8088
      - 9001:9001
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_AUTH_JWT_SECRET_KEY=learnhouse-dev-secret-key-for-jwt-signing-min-32
      - LEARNHOUSE_SQL_CONNECTION_STRING=postgresql://learnhouse:learnhouse@learnhouse-db:5432/learnhouse
      - LEARNHOUSE_REDIS_CONNECTION_STRING=redis://learnhouse-redis:6379
      - LEARNHOUSE_OSS=true
      - NEXT_PUBLIC_LEARNHOUSE_OSS=true
      - NEXT_PUBLIC_LEARNHOUSE_MEDIA_URL=http://localhost:8088
      - NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL=http://localhost:8088
      - LEARNHOUSE_INITIAL_ADMIN_PASSWORD=learnhouse123
      - LEARNHOUSE_INTERNAL_SECRET=learnhouse-internal-secret-for-collab
      - COLLAB_INTERNAL_KEY=learnhouse-internal-secret-for-collab
      - LEARNHOUSE_AI_API_BASE_URL=https://uniapi.ruijie.com.cn/v1
      - LEARNHOUSE_AI_API_KEY=sk-xpMI4OqZm8BK6dsfdu44L07x7BaA2TuO9coIWU5EGISuERAc
      - LEARNHOUSE_AI_MODEL_NAME=qwen3.5-plus
      - LEARNHOUSE_AI_EMBEDDING_MODEL=text-embedding-v4
      - LEARNHOUSE_ANALYTICS_API_URL=http://learnhouse-clickhouse:8123
      - LEARNHOUSE_ANALYTICS_USERNAME=default
      - LEARNHOUSE_ANALYTICS_PASSWORD=
      - LEARNHOUSE_ANALYTICS_INGEST_TOKEN=
      - LEARNHOUSE_ANALYTICS_READ_TOKEN=
      # MinIO / S3 storage
      - LEARNHOUSE_CONTENT_DELIVERY_TYPE=s3api
      - LEARNHOUSE_S3_API_BUCKET_NAME=learnhouse-media
      - LEARNHOUSE_S3_API_ENDPOINT_URL=http://minio:9000
      - LEARNHOUSE_S3_API_ACCESS_KEY=minioadmin
      - LEARNHOUSE_S3_API_SECRET_KEY=minioadmin123
    volumes:
      - /data/service/learnhouse/learnhouse/apps/api:/app/api
      - /data/service/learnhouse/docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - /app/api/.venv
    networks:
      - learnhouse-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost/api/v1/health
      interval: 30s
      timeout: 10s

  db:
    image: pgvector/pgvector:pg16
    container_name: learnhouse-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=learnhouse
      - POSTGRES_PASSWORD=learnhouse
      - POSTGRES_DB=learnhouse
    volumes:
      - /data/service/learnhouse/data/db:/var/lib/postgresql/data
    networks:
      - learnhouse-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U learnhouse
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    container_name: learnhouse-redis
    restart: unless-stopped
    volumes:
      - /data/service/learnhouse/data/redis:/data
    networks:
      - learnhouse-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: learnhouse-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - CLICKHOUSE_DB=learnhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - /data/service/learnhouse/clickhouse_data:/var/lib/clickhouse
      - /data/service/learnhouse/docker/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - learnhouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 4s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: learnhouse-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9091:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - /data/service/learnhouse/data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - learnhouse-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 4s
      retries: 5


networks:
  learnhouse-network:
    driver: bridge

